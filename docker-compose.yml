# Main docker-compose.yml that orchestrates backend and frontend microservices
# This file includes the docker-compose files from the microservices

include:
  - path: ./backend/docker-compose.yml
  - path: ./frontend/docker-compose.yml

# Define the shared network
networks:
  milyfe_network:
    driver: bridge

# Define shared volumes (if needed)
volumes:
  postgres_data:
  backend_vendor:
